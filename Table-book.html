<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="booking-container">

    <div class="cafe-image">
        <img src="c:\Users\shrut\OneDrive\Pictures\def0d7a2-5a32-4eb4-90d5-92ab8fccbce2.png" alt="Cafe Image">
    </div>

    <div class="booking-form">
        <h1>Table Booking Form</h1>

        <input type="text" placeholder="Name">
        <br></br>
        <input type="email" placeholder="Email">
        <br></br>
        <input type="tel" placeholder="Phone Number">

        <br></br>

        <label>Booking Date</label>
        <input type="date">

        <br></br>

        <label>Time</label>
        <input type="time">

        <br>

        <select>
            <option>Number of Adults</option>
            <option>2 Adult</option>
            <option>3 Adults</option>
            <option>4 Adults</option>
            <option>5+ Adults</option>
            <option>10+ Adults</option>
        </select>
        <br></br>

        <select>
            <option>Number of Children</option>
            <option>0 Children</option>
            <option>1 Child</option>
            <option>2 Children</option>
            <option>4 Children</option>
            <option>5+ Children</option>
        </select>
        <br></br>

        <button type="button" class="btn btn-info">Reserve a table</button>

    </div>

</div>


</body>
</html>
